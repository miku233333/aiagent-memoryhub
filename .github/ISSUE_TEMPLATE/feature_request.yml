name: Feature request
description: Propose a scoped enhancement to AI Agent MemoryHub.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include consent, scope, audit, and safe-default expectations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety boundary
      options:
        - label: This request does not seek to evade provider eligibility, geographic, account-integrity, or abuse-prevention controls.
          required: true
