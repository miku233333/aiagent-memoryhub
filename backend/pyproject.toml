[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-memory-hub"
version = "0.1.0"
description = "Scoped, auditable memory synchronization hub for AI clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]
build = [
  "pyinstaller>=6.16,<7",
]

[project.scripts]
memory-hub = "memory_hub.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_hub"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
